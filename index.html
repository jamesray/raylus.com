<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <meta name="color-scheme" content="dark"/>
  <title>RAYLUS</title>
  <meta name="description" content="ascii glyphs."/>
  <meta name="robots" content="index,follow"/>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32'/%3E%3C/svg%3E">
  <style>
    :root{
      --bg:#05070a; --fg:#e7ecef;
      --hueA:230; --hueB:280;
      --grid-alpha:.024;          /* subtler grid */
      --grid-size:22px;
      --pad:20px;                 /* desktop padding */
      --mobile-pad:clamp(14px, 6vw, 28px); /* equal padding on phones */
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0; color:var(--fg);
      font:16px/1.5 ui-sans-serif,system-ui,-apple-system,Segoe UI,Inter,Roboto,Arial,sans-serif;
      user-select:none; overflow:hidden; display:grid; place-items:center;
      background:var(--bg);
    }

    /* Stage fills viewport perfectly on mobile & fullscreen */
    .stage{
      position:relative;
      width:100vw;
      height:100svh; /* avoids iOS URL bar snap */
      isolation:isolate;
      padding:var(--pad);
    }

    /* Background layers (subtle, seam-free) */
    .layer{position:absolute; inset:0; pointer-events:none}

    .lights::before{
      content:""; position:absolute; inset:-8%;
      background:
        radial-gradient(1000px 700px at 14% 12%,
          color-mix(in oklab, oklch(.98 .05 255) 9%, transparent) 0%,
          color-mix(in oklab, oklch(.95 .04 240) 7%, transparent) 38%,
          transparent 70%),
        radial-gradient(900px 600px at 86% 84%,
          color-mix(in oklab, oklch(.96 .04 210) 5%, transparent) 0%,
          transparent 58%),
        radial-gradient(1400px 900px at 50% 50%,
          transparent 48%, rgba(0,0,0,.18) 100%);
      filter: blur(.2px);
      opacity:.9;
    }

    .grid::before{
      content:""; position:absolute; inset:0;
      background-image:
        linear-gradient(rgba(255,255,255,var(--grid-alpha)) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,var(--grid-alpha)) 1px, transparent 1px);
      background-size:var(--grid-size) var(--grid-size), var(--grid-size) var(--grid-size);
      mix-blend-mode:overlay; opacity:.85;
    }

    .scan::before{
      content:""; position:absolute; inset:0;
      background-image:
        repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 3px),
        radial-gradient(260px 100px at 50% -30px, rgba(255,255,255,.03), transparent);
      mix-blend-mode:overlay; opacity:.16;
    }

    .sweep{
      --sweep-alpha:.028;
      position:absolute; inset:-18%;
      background:linear-gradient(45deg,
        rgba(180,210,255,var(--sweep-alpha)) 0%,
        rgba(0,0,0,0) 50%,
        rgba(180,210,255,var(--sweep-alpha)) 100%);
      mix-blend-mode:plus-lighter; opacity:.22;
      transform-origin:12% 10%;
      animation:sweep 28s linear infinite;
      pointer-events:none;
    }
    @keyframes sweep{ to { transform:rotate(360deg); } }
    @media (prefers-reduced-motion: reduce){ .sweep{ animation:none } }

    /* Centered by default (desktop/tablet) */
    .center{
      position:absolute; inset:0;
      display:grid; place-items:center;
      pointer-events:none;
    }
    /* Phone: top-center with equal padding */
    @media (max-width: 768px), (hover:none), (pointer:coarse){
      .stage{ padding:var(--mobile-pad); }
      .center{ justify-items:center; align-items:start; }
    }

    /* Screensaver bouncer */
    .wrap{ position:absolute; left:0; top:0; will-change:transform }
    .box{ display:inline-block; pointer-events:auto }

    /* ASCII style */
    pre.ascii{
      margin:0; white-space:pre; line-height:1.0;
      font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
      font-size: clamp(9px, 3.0vw, 21px); /* smaller on phones */
      letter-spacing:.02em; text-rendering:optimizeSpeed;
      filter: drop-shadow(0 0 .22rem rgba(0,0,0,.5))
              drop-shadow(0 0 .1rem rgba(140,180,255,.1));
      color: oklch(.92 .03 var(--hueA));
    }

    /* Digital grain */
    .noise{
      position:absolute; inset:-25vmax;
      background:repeating-conic-gradient(from 0deg, rgba(255,255,255,.01) 0 .25deg, transparent .25deg .5deg);
      animation:n 1.6s steps(8) infinite; mix-blend-mode:soft-light; opacity:.3; pointer-events:none;
    }
    @keyframes n{to{transform:translate3d(0.8%,-0.5%,0)}}

    .hud{
      position:absolute; bottom:32px; inset-inline:0;
      text-align:center; font-size:12px; color:oklch(.78 .04 var(--hueB)); opacity:.72;
    }
    @media (hover:none),(pointer:coarse){ .hud{display:none} } /* hide HUD on mobile */

    /* Barely-visible meta footer */
    .meta{
      position:absolute; bottom:10px; inset-inline:0;
      text-align:center; font-size:11px; letter-spacing:.06em;
      color:#cdd3d880; opacity:.16; user-select:text;
    }

    /* Minimal info overlay (toggle with i) */
    .info{
      position:absolute; top:10px; left:12px;
      font:12px/1.25 ui-monospace,Menlo,Consolas,monospace;
      color:#bcd; opacity:.55; background:rgba(0,0,0,.12);
      padding:.35rem .5rem; border-radius:.4rem;
      backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
      display:none; pointer-events:none;
    }
    .info.on{ display:block }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <!-- background layers -->
    <div class="layer lights"></div>
    <div class="layer grid"></div>
    <div class="layer scan"></div>
    <div class="sweep" aria-hidden="true"></div>

    <!-- one <pre>; we move it between these -->
    <div class="center" id="center"><div class="box" id="centerBox"></div></div>
    <div class="wrap" id="wrap" hidden><div class="box" id="wrapBox"></div></div>

    <div class="noise" aria-hidden="true"></div>

    <div class="hud">
      keys: <kbd>r</kbd> palette • <kbd>↑/↓</kbd> size • <kbd>f</kbd> fullscreen •
      <kbd>s</kbd> screensaver • <kbd>space</kbd> pause • <kbd>i</kbd> info • <kbd>t</kbd>/<kbd>p</kbd>/<kbd>P</kbd> export
    </div>
    <div class="meta" id="meta"></div>
    <div class="info" id="info"></div>
  </div>

  <script>
    // ---------- version/meta ----------
    const VERSION = "pre-alpha v0.0.16";
    const COPYRIGHT = "© James Ray 2025";
    document.getElementById("meta").textContent =
      `${VERSION} — full site coming soon — ${COPYRIGHT}`;

    // ---------- tiny utils ----------
    const pick = a => a[(Math.random()*a.length)|0];
    const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
    const saveBlob = (blob, name) => {
      const a=document.createElement('a');
      a.href=URL.createObjectURL(blob); a.download=name; a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
    };

    // ---------- glyphs ----------
    const GLYPHS={
      R:["████ ","█   █","█   █","████ ","█ █  ","█  █ ","█   █"],
      A:[" ███ ","█   █","█   █","█████","█   █","█   █","█   █"],
      Y:["█   █"," █ █ ","  █  ","  █  ","  █  ","  █  ","  █  "],
      L:["█    ","█    ","█    ","█    ","█    ","█    ","█████"],
      U:["█   █","█   █","█   █","█   █","█   █","█   █"," ███ "],
      S:[" ███ ","█   █","█    "," ███ ","    █","█   █"," ███ "],
      " ":[ "     ","     ","     ","     ","     ","     ","     "]
    };
    const WORD="RAYLUS", ROWS=7;

    const PALETTES=[
      {on:"█",off:" "},{on:"▓",off:" "},{on:"▒",off:" "},
      {on:"⣿",off:" "},{on:"#",off:"."},{on:"■",off:"·"},{on:"@",off:"."}
    ];
    let paletteIndex=0;

    // Optional density set (inspired, but minimal): cycles which row uses which glyph "on" char
    const DENSITY_WAVES = [
      ["on"],                               // uniform
      ["on","on","on","on","on","on","on"],// explicit uniform
      // subtle wave: top/bottom slightly lighter char
      ["on","on","on","on","on","on","on"].map((k,i)=> i%3===0?"on":"on"),
    ];

    function build(on=PALETTES[paletteIndex].on, off=PALETTES[paletteIndex].off){
      const rows=Array.from({length:ROWS},()=> "");
      for(const ch of WORD){
        const g=GLYPHS[ch]||GLYPHS[" "];
        for(let r=0;r<ROWS;r++) rows[r]+=g[r].replaceAll("█",on).replaceAll(" ",off)+"  ";
      }
      return rows;
    }

    // ---------- subtle glitch ----------
    const GLITCH=["█","▓","▒","■","⣿","#","@",":","+","="];
    function mutateLine(line,chance){ return line.replace(/[^\s]/g,c=>Math.random()<chance?pick(GLITCH):c); }
    function rowShift(lines,rate=0.002){
      for(let i=0;i<lines.length;i++){
        if(Math.random()<rate){
          const row=lines[i]; const k=(Math.random()<.5?-1:1)*((Math.random()*2)|0);
          if(k>0) lines[i]=row.slice(k)+row.slice(0,k);
          else if(k<0){ const kk=-k; lines[i]=row.slice(-kk)+row.slice(0,-kk); }
        }
      }
    }
    const disturb=new Map(); // "x,y" -> ttl
    function applyDisturb(lines){
      for(const [key,ttl] of disturb){
        if(ttl<=0){disturb.delete(key);continue;}
        const [gx,gy]=key.split(",").map(Number);
        if(gy>=0&&gy<lines.length){
          const row=lines[gy].split("");
          if(gx>=0&&gx<row.length&&row[gx]!==" ") row[gx]=pick(GLITCH);
          lines[gy]=row.join("");
        }
        disturb.set(key,ttl-1);
      }
    }
    function pointerDisturb(preEl,x,y){
      const r=preEl.getBoundingClientRect();
      const px=x-r.left, py=y-r.top;
      const fs=parseFloat(getComputedStyle(preEl).fontSize)||16;
      const cw=fs*0.62, ch=fs*1.0;
      const gx=Math.floor(px/cw), gy=Math.floor(py/ch);
      const R=3;
      for(let yy=-R;yy<=R;yy++)for(let xx=-R;xx<=R;xx++)
        if(xx*xx+yy*yy<=R*R) disturb.set(`${gx+xx},${gy+yy}`, 5+((R-Math.hypot(xx,yy))|0));
    }

    // ---------- DOM wiring ----------
    const pre=document.createElement('pre'); pre.className='ascii'; pre.setAttribute('aria-label','ASCII art');
    const center=document.getElementById('center'), centerBox=document.getElementById('centerBox');
    const wrap=document.getElementById('wrap'), wrapBox=document.getElementById('wrapBox');
    centerBox.appendChild(pre);

    // ---------- line opacity (digital fade) ----------
    let tAccum=0;
    function lineOpacity(i){
      // faint per-row drift ~0.82..0.93
      const base=0.86 + 0.05*Math.sin(tAccum*0.7 + i*0.78);
      const jitter=0.006*(Math.sin(tAccum*2.7 + i*1.9));
      return clamp(base + jitter, 0.82, 0.93);
    }

    // ---------- color drift ----------
    let hueA=230,hueB=280;
    function drift(dt){
      hueA=(hueA+5*dt)%360; hueB=(hueB+8*dt)%360;
      const root=document.documentElement;
      root.style.setProperty('--hueA',hueA.toFixed(2));
      root.style.setProperty('--hueB',hueB.toFixed(2));
    }

    // ---------- screensaver physics ----------
    let saver=false, paused=false;
    let pos={x:0,y:0}, vel={x:110,y:92}, maxX=0,maxY=0;

    function measureBounds(){
      const sw=document.documentElement.clientWidth, sh=document.documentElement.clientHeight;
      const bw=wrapBox.offsetWidth, bh=wrapBox.offsetHeight;
      maxX=Math.max(0,sw-bw); maxY=Math.max(0,sh-bh);
      pos.x=Math.min(Math.max(pos.x,0),maxX); pos.y=Math.min(Math.max(pos.y,0),maxY);
    }
    function stepBounce(dt){
      if(paused) return;
      pos.x+=vel.x*dt; pos.y+=vel.y*dt;
      if(pos.x<0){pos.x=-pos.x; vel.x=-vel.x;}
      if(pos.x>maxX){pos.x=2*maxX-pos.x; vel.x=-vel.x;}
      if(pos.y<0){pos.y=-pos.y; vel.y=-vel.y;}
      if(pos.y>maxY){pos.y=2*maxY-pos.y; vel.y=-vel.y;}
      wrap.style.transform=`translate(${pos.x}px,${pos.y}px)`;
    }

    // ---------- paint ----------
    let fontScaleNudge = 0; // adjusted by ↑/↓ (desktop only)
    function setFontScale(){
      // base clamp + nudges (~±10%)
      const base = window.matchMedia("(hover:none),(pointer:coarse)").matches
        ? "clamp(9px, 3.0vw, 21px)"
        : "clamp(10px, 2.1vw, 22px)";
      const nudged = Math.max(-0.15, Math.min(0.15, fontScaleNudge));
      pre.style.fontSize = `calc(${base} * ${ (1+nudged).toFixed(3) })`;
    }
    setFontScale();

    function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[m]))}
    function paint(){
      const rows = build();
      let lines = rows.map((line,i)=> mutateLine(line, i%2?0.004:0.002));
      rowShift(lines,0.002);
      applyDisturb(lines);
      pre.innerHTML = lines.map((ln,i)=>`<span class="row" style="opacity:${lineOpacity(i)}">${escapeHtml(ln)}</span>`).join("\n");
    }

    // ---------- info overlay & fps ----------
    const infoEl = document.getElementById('info');
    let showInfo = false;
    let lastFpsT = performance.now(), frames=0, fps=0;
    function tickFps(now){
      frames++;
      if(now - lastFpsT >= 1000){
        fps = Math.round((frames*1000)/(now-lastFpsT));
        frames=0; lastFpsT = now;
      }
    }
    function renderInfo(){
      if(!showInfo){ infoEl.classList.remove('on'); return; }
      infoEl.classList.add('on');
      const pal = PALETTES[paletteIndex].on;
      infoEl.textContent = `fps ${fps} · pal ${pal} · ${VERSION}`;
    }

    // ---------- RAF loop ----------
    let last=performance.now();
    function frame(now){
      const dt=(now-last)/1000; last=now; tAccum+=dt;
      tickFps(now);
      drift(dt);
      if(saver) stepBounce(dt);
      paint();
      renderInfo();
      requestAnimationFrame(frame);
    }
    paint(); requestAnimationFrame(frame);

    // ---------- input ----------
    addEventListener("pointerdown", e=>pointerDisturb(pre,e.clientX,e.clientY));
    addEventListener("pointermove", e=>{ if(e.buttons) pointerDisturb(pre,e.clientX,e.clientY); });

    addEventListener("keydown", e=>{
      if(e.code==="Space"){ if(saver){ paused=!paused; } e.preventDefault(); return; }
      if(e.key==="s"){
        saver=!saver; paused=false;
        if(saver){
          wrap.hidden=false; center.hidden=true; wrapBox.appendChild(pre);
          requestAnimationFrame(()=>{
            measureBounds();
            pos.x=Math.random()*maxX; pos.y=Math.random()*maxY;
            vel.x=(Math.random()<.5?-1:1)*(90+Math.random()*50);
            vel.y=(Math.random()<.5?-1:1)*(80+Math.random()*50);
            wrap.style.transform=`translate(${pos.x}px,${pos.y}px)`;
          });
        }else{
          wrap.hidden=true; center.hidden=false; wrap.style.transform="";
          pos={x:0,y:0}; centerBox.appendChild(pre);
        }
        return;
      }
      if(e.key==="r"){ paletteIndex=(paletteIndex+1)%PALETTES.length; return; }
      if(e.key==="f"){
        document.fullscreenElement?document.exitFullscreen()
          : document.documentElement.requestFullscreen?.().catch(()=>{});
        return;
      }
      if(e.key==="i"){ showInfo=!showInfo; renderInfo(); return; }
      if(e.key==="ArrowUp"){ fontScaleNudge += 0.03; setFontScale(); return; }
      if(e.key==="ArrowDown"){ fontScaleNudge -= 0.03; setFontScale(); return; }
      if(e.key==="t"){
        // export TXT of current frame
        const text = [...pre.childNodes].map(n=>n.textContent).join("\n");
        const blob = new Blob([text], {type:"text/plain;charset=utf-8"});
        saveBlob(blob, `raylus-${Date.now()}.txt`);
        return;
      }
      if(e.key==="p" || e.key==="P"){
        // export PNG by drawing the pre text onto a canvas (simple raster)
        const scale = e.key==="P" ? 4 : 1;
        const lines = [...pre.childNodes].map(n=>n.textContent);
        const fs = parseFloat(getComputedStyle(pre).fontSize)||16;
        const cw = fs*0.62, ch = fs*1.0;
        const w = Math.ceil(Math.max(...lines.map(l=>l.length)) * cw);
        const h = Math.ceil(lines.length * ch);
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.floor(w*scale));
        canvas.height = Math.max(1, Math.floor(h*scale));
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled=false;
        ctx.scale(scale, scale);
        ctx.fillStyle = getComputedStyle(document.body).backgroundColor || "#000";
        ctx.fillRect(0,0,w,h);
        ctx.font = `${fs}px ${getComputedStyle(pre).fontFamily}`;
        ctx.textBaseline = "top";
        ctx.fillStyle = getComputedStyle(pre).color || "#eee";
        lines.forEach((ln,i)=>ctx.fillText(ln, 0, i*ch));
        canvas.toBlob(b=>saveBlob(b, `raylus-${Date.now()}@${scale}x.png`));
        return;
      }
    });

    addEventListener("resize", ()=>{ if(saver) measureBounds(); });
  </script>
</body>
</html>
