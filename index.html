<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>raylus</title>
  <meta name="robots" content="noindex,nofollow" />
  <meta name="description" content="…" />
  <meta property="og:title" content="raylus" />
  <meta property="og:description" content="…" />
  <meta property="og:type" content="website" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32'/%3E%3C/svg%3E">
  <style>
    /* minimal, elusive */
    :root {
      --bg: #0b0c10;
      --fg: #e7e9ec;
      --muted: #9aa0a6;
      --ring: #1b1f24;
      --accent: #9bbcff;
    }
    @media (prefers-color-scheme: light) {
      :root { --bg:#fafafa; --fg:#111; --muted:#656b72; --ring:#e8eaed; --accent:#1a73e8; }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(1200px 600px at 80% -10%, color-mix(in oklab, var(--accent) 12%, transparent), transparent),
        radial-gradient(900px 400px at -10% 110%, color-mix(in oklab, var(--accent) 10%, transparent), transparent),
        var(--bg);
      color: var(--fg);
      font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Inter, Roboto, Arial, sans-serif;
      display: grid; place-items: center;
      padding: 24px;
    }
    main {
      width: min(720px, 100%);
      border: 1px solid var(--ring);
      background: color-mix(in oklab, var(--bg) 92%, transparent);
      border-radius: 20px;
      padding: clamp(18px, 4vw, 28px);
      text-align: center;
      backdrop-filter: blur(6px);
    }
    h1 {
      margin: 0 0 6px;
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }
    .dot {
      display: inline-block;
      width: .5em; height: .5em;
      border-radius: 999px;
      background: currentColor;
      opacity: .8;
      animation: pulse 2.4s ease-in-out infinite;
      vertical-align: middle;
      margin-left: .25em;
    }
    @keyframes pulse {
      0%, 100% { opacity: .2; transform: scale(1); }
      50% { opacity: .9; transform: scale(1.25); }
    }
    nav {
      margin-top: 14px;
      display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    }
    a.min {
      color: var(--muted); text-decoration: none; border: 1px dashed var(--ring);
      padding: 8px 10px; border-radius: 999px; font-size: 12px;
    }
    a.min:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>raylus<span class="dot" aria-hidden="true"></span></h1>
    <p>…coming soon</p>
    <!-- optional tiny links; remove if you want it even more elusive -->
    <nav aria-label="minimal links">
      <a class="min" href="mailto:hello@raylus.com">contact</a>
      <a class="min" href="/" rel="nofollow">/</a>
    </nav>
  </main>
</body>
</html>
